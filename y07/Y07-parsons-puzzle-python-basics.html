<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsons Puzzle: Put the Code in Order</title>
<style>
  :root { --dark:#1E1147; --main:#3B1E8E; --pale:#F2EDFF; --red:#E23E48; --teal:#00BFA6; --yellow:#FFC233; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--dark); font:18px/1.45 Arial,Helvetica,sans-serif; }
  header { background:var(--main); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  header img { height:62px; display:block; }
  header h1 { margin:0; font-size:28px; flex:1; min-width:240px; }
  .stars { background:var(--yellow); color:var(--dark); font-weight:bold; padding:8px 16px; border-radius:20px; white-space:nowrap; }
  main { max-width:860px; margin:0 auto; padding:20px 24px 40px; }
  .progress { font-weight:bold; color:var(--main); margin:0 0 4px; }
  h2 { margin:0 0 8px; font-size:26px; color:var(--main); }
  .panel { background:var(--pale); border-radius:12px; padding:12px 18px; margin:14px 0; }
  .panel h3 { margin:0 0 4px; font-size:18px; }
  pre, .line { font-family:Consolas,"Courier New",monospace; font-size:20px; }
  pre { margin:0; white-space:pre-wrap; }
  ol#lines { list-style:none; margin:14px 0; padding:0; }
  .line { display:flex; align-items:center; gap:12px; white-space:pre; background:#fff; border:2px solid var(--main); border-radius:10px;
          padding:11px 14px; margin:8px 0; cursor:grab; touch-action:none; user-select:none; overflow-x:auto; }
  .line:focus { outline:3px solid var(--yellow); outline-offset:2px; }
  .line.dragging { cursor:grabbing; background:var(--pale); box-shadow:0 4px 12px rgba(30,17,71,.35); }
  .grip { color:var(--main); font-family:Arial,sans-serif; letter-spacing:-2px; font-weight:bold; }
  .code { flex:1; }
  .mark { font:bold 16px Arial,sans-serif; white-space:nowrap; }
  .line.right { border-color:#00806F; background:#E5F8F5; }
  .line.right .mark { color:#00665A; }
  .line.wrong { border-color:var(--red); background:#FDECED; }
  .line.wrong .mark { color:#B3212B; }
  .solved .line { cursor:default; }
  button { font:bold 18px Arial,sans-serif; border:0; border-radius:10px; padding:12px 24px; cursor:pointer; margin:0 10px 8px 0; }
  .primary { background:var(--main); color:#fff; }
  .secondary { background:var(--pale); color:var(--dark); }
  button:focus { outline:3px solid var(--yellow); outline-offset:2px; }
  #feedback { font-weight:bold; font-size:20px; min-height:30px; margin:6px 0 12px; }
  .hint { font-size:16px; }
  [hidden] { display:none !important; }
  .end { text-align:center; padding:30px 0; }
  .end .big { font-size:64px; font-weight:bold; color:var(--main); margin:10px 0; }
</style>
</head>

  <h1>Put the Code in Order</h1>
  <div class="stars" id="stars" aria-live="polite">Stars: 0</div>
</header>
<main>
  <section id="game">
    <p class="progress" id="progress"></p>
    <h2 id="title"></h2>
    <div class="panel"><h3>The program should show this:</h3><pre id="goal"></pre></div>
    <p class="hint">Drag the lines into the right order, then press Check. No mouse? Click a line, then use the up and down arrow keys.</p>
    <ol id="lines"></ol>
    <div id="feedback" role="status"></div>
    <button class="primary" id="check">Check my code</button>
    <button class="secondary" id="shuffle">Shuffle again</button>
    <button class="primary" id="next" hidden>Next puzzle</button>
  </section>
  <section id="end" class="end" hidden>
    <h2>All done!</h2>
    <div class="big" id="final"></div>
    <p id="finalNote"></p>
    <button class="primary" id="again">Play again</button>
  </section>
</main>
<script>
// To change the puzzles, edit this list. Lines are in the correct order, and spaces at the start of a line are kept.
const PUZZLES = [
  { title: "Say it in order",
    goal: "Hello!\nMy name is Sam\nGoodbye!",
    lines: ['print("Hello!")', 'print("My name is Sam")', 'print("Goodbye!")'],
    tip: "Python runs a program from the top line down." },
  { title: "Change a variable",
    goal: "15",
    lines: ['score = 10', 'score = score + 5', 'print(score)'],
    tip: "A variable has to store something before the program can use it." },
  { title: "Repeat with FOR",
    goal: "15",
    lines: ['score = 0', 'for i in range(3):', '    score = score + 5', 'print(score)'],
    tip: "The indented line belongs to the FOR line above it, so it repeats. The last line isn't indented, so it only runs once, at the end." },
  { title: "A variable can change",
    goal: "Hello James\nHello Mia",
    lines: ['name = "James"', 'print("Hello", name)', 'name = "Mia"', 'print("Hello", name)'],
    tip: "When you put something new in a variable, the old value is gone. print shows whatever is in the box at that moment." },
  { title: "Maths in the right order",
    goal: "5",
    lines: ['apples = 4', 'apples = apples * 2', 'apples = apples - 3', 'print(apples)'],
    tip: "4 times 2 is 8, then take away 3 to get 5. If you take away first, you get 2, so the order of the lines matters." },
  { title: "Make a decision with IF",
    goal: "You win!",
    lines: ['score = 12', 'if score > 10:', '    print("You win!")', 'else:', '    print("Try again")'],
    tip: "12 is bigger than 10, so the line under IF runs. The line under ELSE only runs when the answer is no." },
  { title: "Repeat, then stop",
    goal: "Hello\nHello\nHello\nGoodbye",
    lines: ['for i in range(3):', '    print("Hello")', 'print("Goodbye")'],
    tip: "Only the indented line repeats. Goodbye isn't indented, so it runs once, after the loop has finished." },
  { title: "Put it all together",
    goal: "You can buy the game!",
    lines: ['coins = 0', 'for i in range(4):', '    coins = coins + 5', 'if coins > 15:', '    print("You can buy the game!")'],
    tip: "The loop adds 5 four times, so coins is 20. 20 is bigger than 15, so the message shows." },
];
const $ = (id) => document.getElementById(id);
const list = $("lines");
let current = 0, tries = 0, stars = 0;

function shuffled(items) {
  const a = items.slice();
  do {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  } while (a.every((x, i) => x === items[i]));
  return a;
}
function drawLines(items) {
  list.innerHTML = "";
  list.classList.remove("solved");
  items.forEach((text) => {
    const li = document.createElement("li");
    li.className = "line"; li.tabIndex = 0; li.dataset.text = text;
    li.setAttribute("aria-label", "Code line: " + text);
    const grip = document.createElement("span"); grip.className = "grip"; grip.textContent = "⋮⋮"; grip.setAttribute("aria-hidden", "true");
    const code = document.createElement("span"); code.className = "code"; code.textContent = text;
    const mark = document.createElement("span"); mark.className = "mark";
    li.append(grip, code, mark);
    list.append(li);
  });
}
function clearMarks() {
  list.querySelectorAll(".line").forEach((l) => { l.classList.remove("right", "wrong"); l.querySelector(".mark").textContent = ""; });
}
function start() {
  const p = PUZZLES[current];
  tries = 0;
  $("progress").textContent = `Puzzle ${current + 1} of ${PUZZLES.length}`;
  $("title").textContent = p.title;
  $("goal").textContent = p.goal;
  $("feedback").textContent = "";
  $("check").hidden = false; $("shuffle").hidden = false; $("next").hidden = true;
  drawLines(shuffled(p.lines));
}
const isSolved = () => list.classList.contains("solved");
function check() {
  const p = PUZZLES[current];
  const rows = [...list.children];
  tries++;
  let right = 0;
  rows.forEach((row, i) => {
    const ok = row.dataset.text === p.lines[i];
    if (ok) right++;
    row.classList.toggle("right", ok); row.classList.toggle("wrong", !ok);
    row.querySelector(".mark").textContent = ok ? "✓ Right place" : "✗ Move me";
  });
  if (right === rows.length) {
    const won = tries === 1 ? 3 : tries === 2 ? 2 : 1;
    stars += won;
    $("stars").textContent = `Stars: ${stars}`;
    $("feedback").textContent = `Correct! ${won} ${won === 1 ? "star" : "stars"}. ${p.tip}`;
    list.classList.add("solved");
    $("check").hidden = true; $("shuffle").hidden = true; $("next").hidden = false;
    $("next").textContent = current === PUZZLES.length - 1 ? "See my score" : "Next puzzle";
    $("next").focus();
  } else {
    $("feedback").textContent = `${right} of ${rows.length} lines are in the right place. Try again.`;
  }
}
// Dragging, with a mouse or a touch screen
let dragged = null;
list.addEventListener("pointerdown", (e) => {
  const row = e.target.closest(".line");
  if (!row || isSolved()) return;
  dragged = row; row.classList.add("dragging"); row.setPointerCapture(e.pointerId); clearMarks();
});
list.addEventListener("pointermove", (e) => {
  if (!dragged) return;
  const others = [...list.children].filter((r) => r !== dragged);
  const before = others.find((r) => { const b = r.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
  if (before) { if (dragged.nextElementSibling !== before) list.insertBefore(dragged, before); }
  else if (list.lastElementChild !== dragged) list.append(dragged);
});
const drop = () => { if (dragged) { dragged.classList.remove("dragging"); dragged = null; } };
list.addEventListener("pointerup", drop);
list.addEventListener("pointercancel", drop);
// Arrow keys, for anyone not using a mouse
list.addEventListener("keydown", (e) => {
  const row = e.target.closest(".line");
  if (!row || isSolved()) return;
  if (e.key === "ArrowUp" && row.previousElementSibling) { list.insertBefore(row, row.previousElementSibling); }
  else if (e.key === "ArrowDown" && row.nextElementSibling) { list.insertBefore(row.nextElementSibling, row); }
  else return;
  e.preventDefault(); clearMarks(); row.focus();
});
$("check").addEventListener("click", check);
$("shuffle").addEventListener("click", () => { $("feedback").textContent = ""; drawLines(shuffled(PUZZLES[current].lines)); });
$("next").addEventListener("click", () => {
  current++;
  if (current < PUZZLES.length) { start(); return; }
  const best = PUZZLES.length * 3;
  $("game").hidden = true; $("end").hidden = false;
  $("final").textContent = `${stars} of ${best} stars`;
  $("finalNote").textContent = stars === best ? "Every puzzle right first time!" : "Play again to try for all the stars.";
});
$("again").addEventListener("click", () => {
  current = 0; stars = 0; $("stars").textContent = "Stars: 0";
  $("end").hidden = true; $("game").hidden = false; start();
});
start();
</script>
