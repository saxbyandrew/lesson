<!DOCTYPE html>
<html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Computing lessons</title>
<style>:root{--dark:#0B3C6F;--tint:#E6F2FB;--accent1:#D6336C;--accent2:#1976D2}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.55;color:#1a1a1a;background:#fff}
header{background:var(--tint);border-bottom:4px solid var(--dark)}
header .wrap{display:flex;align-items:center;gap:20px;padding:18px 20px}
header img.logo{height:58px}
header h1{margin:0;font-size:32px;color:var(--dark)}
header p{margin:2px 0 0;color:#404040;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
main{padding:10px 0 40px}
h2{background:var(--tint);color:var(--dark);font-size:22px;padding:8px 14px;border-left:6px solid var(--dark);border-radius:4px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2 svg{width:22px;height:22px;flex:none}
h3{color:var(--dark);font-size:19px;margin:22px 0 8px}
a{color:var(--accent2)}
strong{color:var(--dark)}
code{font-family:Consolas,"Courier New",monospace;font-size:16px;background:#f3f3f3;padding:1px 5px;border-radius:3px}
pre{background:#f6f8fa;border:1px solid #d0d7de;border-left:5px solid var(--accent2);border-radius:6px;padding:12px 16px;overflow-x:auto}
pre code{background:none;padding:0;font-size:17px;line-height:1.5}
table{border-collapse:collapse;margin:12px 0;width:100%}
th,td{border:1px solid #bbb;padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--tint);color:var(--dark)}
img.pic{max-width:100%;height:auto;display:block;margin:14px auto;border-radius:6px}
.box{border-radius:8px;padding:12px 18px;margin:18px 0;border:2px solid var(--dark)}
.box .box-title{font-weight:bold;color:var(--dark);margin:0 0 6px;font-size:19px}
.box.remember,.box.tip,.box.note{border:none;border-left:7px solid var(--dark);background:var(--tint)}
.box.challenge{border:2px dashed var(--accent1)}
.box.challenge .box-title{color:var(--accent1)}
.box.important,.box.warning{border:none;border-left:7px solid var(--accent1);background:#fff4f4}
.box.aims{border:2px solid var(--dark)}
a.button{display:inline-block;background:var(--dark);color:#fff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:8px;font-size:19px}
a.button:hover{opacity:.9}
footer{border-top:1px solid #ccc;color:#555;font-size:14px;padding:14px 0 30px}
.empty{text-align:center;padding:80px 20px;color:#404040}
.empty h2{display:block;background:none;border:none;font-size:28px}
</style></head>
<body><header><div class="wrap"><img class="logo" src="school-logo.png" alt="City Impact Church School logo">
<div><h1>Computing lessons</h1><p>City Impact Church School</p></div></div></header>
<main class="wrap"><div class="empty"><h2>Use the link from your teacher</h2><p>Each class has its own page.</p></div></main>
<footer class="wrap">City Impact Church School</footer></body></html>
